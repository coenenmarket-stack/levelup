# Codemagic builds iOS from Capacitor — configure signing in the Codemagic UI first.
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-capacitor-app/

workflows:
  ios-testflight:
    name: Level Up Life — iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic

    environment:
      # App-specific group: CERTIFICATE_PRIVATE_KEY for Level Up Life only
      groups:
        - levelup-signing
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: com.coenenmarket.leveluplife
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        # Match App Store Connect integration name in Codemagic → Teams → Integrations
        APP_STORE_CONNECT_PUBLISHER: codemagic

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: release/*
          include: true
        # Launch branch: ship icon/ASC fixes to TestFlight before merging to main.
        - pattern: cursor/app-store-launch-assets
          include: true

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Log commit for icon verification
        script: |
          set -euo pipefail
          echo "CM_COMMIT=${CM_COMMIT:-}"
          echo "CM_BRANCH=${CM_BRANCH:-}"
          echo "BUILD_NUMBER=${BUILD_NUMBER:-}"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Typecheck
        script: npm run check

      - name: Build web bundle
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Verify web assets synced into iOS
        script: |
          set -euo pipefail
          test -f ios/App/App/public/index.html
          test -f ios/App/App/capacitor.config.json
          # Fail the build if the web bundle did not sync (blank WKWebView forever).
          if ! ls ios/App/App/public/assets/*.js >/dev/null 2>&1; then
            echo "Missing bundled JS under ios/App/App/public/assets"
            ls -la ios/App/App/public || true
            exit 1
          fi
          echo "Synced web assets OK:"
          ls ios/App/App/public | head

      # Single source of truth: assets/icon.png (never regenerated from SVG).
      # AppIcon is written by sharp (script/sync-ios-app-icon.ts), NOT left to
      # capacitor-assets — that tool's default white flatten caused white TF corners.
      # Splash still uses cap:assets with explicit #0d1117 backgrounds.
      - name: Generate iOS icons and splash
        script: |
          set -euo pipefail
          test -f assets/icon.png
          npm run icons
          # Splash only path still goes through capacitor-assets (with dark BG).
          npm run cap:assets
          # Always overwrite AppIcon afterward with the complete opaque set.
          npm run icons:ios
          npm run icons:verify
          echo "AppIcon pipeline OK for commit ${CM_COMMIT:-unknown}"

      - name: Set iOS build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
          echo "CFBundleVersion set to $BUILD_NUMBER (commit ${CM_COMMIT:-unknown})"

      # Creates/fetches Level Up Life App Store profile + certificate for this key only.
      - name: Set up code signing
        script: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "Missing CERTIFICATE_PRIVATE_KEY."
            echo "Add it in Codemagic → levelup → Environment variables:"
            echo "  name: CERTIFICATE_PRIVATE_KEY"
            echo "  group: levelup-signing"
            echo "  secret: yes"
            exit 1
          fi
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --archive-method app-store

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

  ios-simulator:
    name: Level Up Life — iOS Simulator (CI smoke)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: latest
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App

    scripts:
      - name: Install and build web
        script: |
          npm ci
          npm run check
          npm run build
          npx cap sync ios

      - name: Compile for simulator
        script: |
          xcodebuild build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            CODE_SIGNING_ALLOWED=NO
